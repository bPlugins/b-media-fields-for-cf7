<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12306b"/>
      <stop offset="0.55" stop-color="#1f4f9c"/>
      <stop offset="1" stop-color="#4b37c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2271b1"/>
      <stop offset="1" stop-color="#6c4df6"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe7f7"/>
      <stop offset="1" stop-color="#e9e2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <circle cx="300" cy="250" r="260" fill="url(#glow)"/>
  <!-- decorative floating shapes -->
  <g fill="#ffffff" fill-opacity="0.06">
    <circle cx="1380" cy="70" r="90"/>
    <circle cx="1460" cy="420" r="140"/>
    <rect x="700" y="-40" width="220" height="220" transform="rotate(20 810 70)"/>
  </g>

  <!-- ICON ZONE (left) -->
  <g transform="translate(140,90)" filter="url(#shadow)">
    <rect width="320" height="320" rx="64" fill="url(#tile)"/>
    <g transform="scale(1.25)">
      <rect x="44" y="40" width="168" height="176" rx="14" fill="#ffffff"/>
      <rect x="60" y="56" width="136" height="78" rx="8" fill="url(#strip)"/>
      <path d="M117 77 L148 95 L117 113 Z" fill="#2271b1"/>
      <g fill="#6c4df6">
        <rect x="70" y="112" width="5" height="12"/>
        <rect x="79" y="104" width="5" height="20"/>
        <rect x="88" y="108" width="5" height="16"/>
        <rect x="97" y="100" width="5" height="24"/>
      </g>
      <g transform="translate(168,96)" fill="none" stroke="#2271b1" stroke-width="3.5" stroke-linejoin="round">
        <path d="M0 -14 L14 -7 L14 9 L0 16 L-14 9 L-14 -7 Z"/>
        <path d="M-14 -7 L0 0 L14 -7 M0 0 L0 16"/>
      </g>
      <rect x="60" y="150" width="136" height="14" rx="4" fill="#e6e8eb"/>
      <rect x="60" y="174" width="96" height="14" rx="4" fill="#e6e8eb"/>
      <rect x="164" y="174" width="32" height="14" rx="4" fill="#2271b1"/>
    </g>
  </g>

  <!-- MESSAGE ZONE -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- pill -->
    <rect x="560" y="112" width="492" height="44" rx="22" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="806" y="141" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="3" fill="#ffffff">MEDIA FIELDS FOR CONTACT FORM 7</text>
    <!-- hero -->
    <text x="560" y="255" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Put media inside</text>
    <text x="560" y="345" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">your forms.</text>
    <!-- sub line -->
    <text x="562" y="400" font-size="28" font-weight="500" fill="#dfe7ff">Video, audio &amp; 3D model fields for Contact Form 7</text>
    <!-- underline accent -->
    <rect x="562" y="364" width="120" height="6" fill="#8ad1ff"/>
  </g>

  <!-- bPlugins logo bottom-right -->
  <image x="1294" y="420" width="210" height="42" href="data:image/svg+xml;base64,"/>
</svg>
