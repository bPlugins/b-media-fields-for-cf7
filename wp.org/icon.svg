<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Media Fields for Contact Form 7 — animated plugin icon.
    bPlugins brand: #146EF5 blue, #FF7A00 orange, #070127 navy.
    Motion: one duration variable, seamless loop, staggered via keyframe
    phase (no animation-delay), frozen under prefers-reduced-motion.
    Rest state (0% / 100%) is identical to the static PNG derivatives.
  -->
  <defs>
    <style>
      svg { --dur: 3.8s; }

      .eq { transform-box: fill-box; transform-origin: 50% 100%; }
      .eq-1 { animation: eq1 var(--dur) ease-in-out infinite; }
      .eq-2 { animation: eq2 var(--dur) ease-in-out infinite; }
      .eq-3 { animation: eq3 var(--dur) ease-in-out infinite; }
      .eq-4 { animation: eq4 var(--dur) ease-in-out infinite; }

      .play { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse var(--dur) ease-in-out infinite; }
      .submit { transform-box: fill-box; transform-origin: 100% 50%; animation: submit var(--dur) ease-in-out infinite; }

      @keyframes eq1 {
        0%, 100% { transform: scaleY(1); }
        20% { transform: scaleY(1.9); }
        45% { transform: scaleY(0.6); }
        70% { transform: scaleY(1.5); }
      }
      @keyframes eq2 {
        0%, 100% { transform: scaleY(1); }
        15% { transform: scaleY(0.55); }
        40% { transform: scaleY(1.15); }
        65% { transform: scaleY(0.7); }
        85% { transform: scaleY(1.1); }
      }
      @keyframes eq3 {
        0%, 100% { transform: scaleY(1); }
        25% { transform: scaleY(1.45); }
        50% { transform: scaleY(0.65); }
        80% { transform: scaleY(1.25); }
      }
      @keyframes eq4 {
        0%, 100% { transform: scaleY(1); }
        30% { transform: scaleY(0.6); }
        55% { transform: scaleY(1.12); }
        75% { transform: scaleY(0.75); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        18% { transform: scale(1.09); }
        40% { transform: scale(1); }
      }
      @keyframes submit {
        0%, 100% { transform: scaleX(1); opacity: 1; }
        50% { transform: scaleX(1); opacity: 1; }
        62% { transform: scaleX(1.08); opacity: 0.85; }
        76% { transform: scaleX(1); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .eq-1, .eq-2, .eq-3, .eq-4, .play, .submit { animation: none; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#146EF5"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1FE"/>
      <stop offset="1" stop-color="#D9E6FD"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- form card -->
  <rect x="36" y="32" width="184" height="192" rx="16" fill="#ffffff"/>

  <!-- media area -->
  <rect x="54" y="50" width="148" height="96" rx="10" fill="url(#strip)"/>

  <!-- play triangle -->
  <path class="play" d="M116 62 L152 84 L116 106 Z" fill="#146EF5"/>

  <!-- audio bars -->
  <g fill="#FF7A00">
    <rect class="eq eq-1" x="108" y="124" width="6" height="12" rx="1"/>
    <rect class="eq eq-2" x="119" y="116" width="6" height="20" rx="1"/>
    <rect class="eq eq-3" x="130" y="120" width="6" height="16" rx="1"/>
    <rect class="eq eq-4" x="141" y="112" width="6" height="24" rx="1"/>
  </g>

  <!-- field rows -->
  <rect x="54" y="160" width="148" height="14" rx="4" fill="#E4E8F0"/>
  <rect x="54" y="186" width="100" height="14" rx="4" fill="#E4E8F0"/>

  <!-- submit button -->
  <rect class="submit" x="162" y="186" width="40" height="14" rx="4" fill="#FF7A00"/>
</svg>
